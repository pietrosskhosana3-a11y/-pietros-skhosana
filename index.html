ture works?',time:'10m',unread:1},{name:'client1',pic:'https://picsum.photos/100?4',last:'R370 mirror still avail?',time:'1h',unread:0}];let marketItems=[{img:'https://picsum.photos/300?20',title:'Mirror R370',price:'R370',seller:'pietros'},{img:'https://picsum.photos/300?21',title:'SA Fashion Cap',price:'R199',seller:'safashion'},{img:'https://picsum.photos/300?22',title:'Mbombela Art',price:'R850',seller:'mbombela'}];let trendingTags=['#Mbombela',' #SAcreator','#RealLikes','#SAfashion','#Entrepreneur','#Reels','#ShopLocal','#SouthAfrica'];let carouselIdx={};function parseCaption(txt){return txt.replace(/#(\w+)/g,'<span class=hashtag onclick=filterTag("$1")>#$1</span>').replace(/@(\w+)/g,'<span class=hashtag onclick=alertTag("$1")>@$1</span>')}function filterTag(tag){showP('exploreP');document.getElementById('trendTags').innerHTML=`<div style=padding:10px>Showing <b>#${tag}</b> • ${posts.filter(p=>p.cap.includes(tag)).length} posts • Trending in SA</div>`+trendingTags.map(t=>`<span class=exploreTag onclick=filterTag("${t.replace('#','')}")>${t}</span>`).join('');}function alertTag(u){notifs.unshift({img:'https://picsum.photos/100?1',t:`<b>You</b> mentioned @${u} • they get notified`,tm:'now',type:'mention'});alert('@'+u+' notified! MENTIONS works + DM sent');showP('dmP')}function render(){let c=document.getElementById('feedC');c.innerHTML='';posts.forEach((p,i)=>{if(!carouselIdx[i])carouselIdx[i]=0;let curImg=p.img[carouselIdx[i]];let d=document.createElement('div');d.className='post';let capHTML=parseCaption(p.cap);let isMulti=p.img.length>1;let commentsHTML=p.cms.map((cm,j)=>`<div class=citem><b>${cm.user||'user'}:</b> ${cm.t} <span class=replyBtn onclick=replyC(${i},${j})>Reply</span> <span class=replyBtn onclick=reportUser('${cm.user}')">⋯ Report</span>${cm.r.map(r=>`<div class=reply><b>you:</b> ${r.t}</div>`).join('')}</div>`).join('');let tagHTML=p.tags.length?`<div style=padding:0 12px;font-size:11px;color:var(--g)>Tagged: ${p.tags.map(t=>`@${t}`).join(', ')}</div>`:'';d.innerHTML=`<div class=ph><div class=phl><img src=https://picsum.photos/50?${i}><b>pietros_skhosana</b> <span class=verified>✔</span> • Mbombela ${p.isAd?'<span class=adBadge>AD • Sponsored</span>':''}</div><span onclick="showPostMenu(${i})">⋯</span></div><div class=carousel><img class=pi src=${curImg} style="filter:${p.filter}" ondblclick=like(${i}) onclick="if(${isMulti})nextImg(${i})">${isMulti?`<div class=dots>${p.img.map((_,k)=>`<div class="dot ${k==carouselIdx[i]?'on':''}"></div>`).join('')}</div><div style=position:absolute;top:50%;right:10px;background:rgba(0,0,0,.6);color:#fff;padding:4px 8px;border-radius:12px;font-size:10px>${carouselIdx[i]+1}/${p.img.length}</div>`:''}</div><div class=pa><div class=pal><span onclick=like(${i})>${p.liked?'❤️':'🤍'}</span><span onclick=toggleC(${i})>💬</span><span onclick=sharePost(${i})>↗️</span><span onclick=openDM('${p.tags[0]||'user'}')>💬</span></div><span onclick=save(${i})>${p.sv?'🔖':'📑'}</span></div><div class=lk>${p.likes.toLocaleString()} REAL LIKES • ${p.reach.toLocaleString()} reach • 1 acc = 1 like 🛡️</div><div class=cp><b>pietros ✔</b> ${capHTML}</div>${tagHTML}<div class=cm onclick=toggleC(${i})>View ${p.cms.length} comments ${p.cms.reduce((a,b)=>a+b.r.length,0)>0?`+ ${p.cms.reduce((a,b)=>a+b.r.length,0)} replies`:''}</div><div class=cl id=cL${i} style=display:none>${commentsHTML}</div><div class=ac><input id=cI${i} placeholder="Add comment... @mention to notify"><span style=color:var(--b);font-weight:700;cursor:pointer;font-size:12px onclick=addC(${i})>Post</span></div>`;c.appendChild(d)});document.getElementById('pGrid').innerHTML=posts.map(p=>`<img src=${p.img[0]} style="filter:${p.filter}">`).join('');document.getElementById('sGrid').innerHTML=posts.map(p=>`<img src=${p.img[0]}>`).join('');document.getElementById('pCount').innerText=posts.length;renderTrends();renderReels();renderDM();renderMarket()}function nextImg(i){carouselIdx[i]=(carouselIdx[i]+1)%posts[i].img.length;render()}function rend )><img src=${d.pic}><div style=flex:1><b>${d.name}</b> ${followersList.find(f=>f.name==d.name)?.verified?'<span style=color:var(--b)>✔</span>':''}<br><small style=color:var(--g)>${d.last}</small></div><div style=text-align:right><small style=color:var(--g)>${d.time}</small>${d.unread?`<br><span style=background:var(--b);color:#fff;font-size:10px;padding:2px 6px;border-radius:10px>${d.unread}</span>`:''}</div></div>`).join('')}function renderMarket(){document.getElementById('marketGrid').innerHTML=marketItems.map(m=>`<div class=marketCard><img src=${m.img}><div class=marketInfo><b>${m.title}</b><br><b style=color:#00c853>${m.price}</b><br><small style=color:var(--g)>by ${m.seller} • Mbombela</small><br><button onclick="buyItem('${m.title}')" style=width:100%;margin-top:6px;padding:6px;background:var(--b);color:#fff;border:none;border-radius:6px;font-size:11px>Buy • WhatsApp</button></div></div>`).join('')}function like(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;render()}function toggleC(i){let e=document.getElementById('cL'+i);e.style.display=e.style.display=='block'?'none':'block'}function addC(i){let inp=document.getElementById('cI'+i);if(!inp.value)return;let txt=inp.value;let isMention=txt.includes('@');posts[i].cms.push({t:txt,r:[],user:'you'});if(isMention){notifs.unshift({img:posts[i].img[0],t:`<b>You</b> mentioned ${txt.match(/@\w+/)[0]} in comment`,tm:'now',type:'mention'});dms.unshift({name:txt.match(/@\w+/)[0].replace('@',''),pic:'https://picsum.photos/100?1',last:txt,time:'now',unread:0})}inp.value='';render();renderN();document.getElementById('cL'+i).style.display='block'}function replyC(pi,ci){let rep=prompt('Reply to comment:');if(!rep)return;posts[pi].cms[ci].r.push({t:rep});render();document.getElementById('cL'+pi).style.display='block';notifs.unshift({img:posts[pi].img[0],t:`<b>You</b> replied: ${rep}`,tm:'now',type:'reply'})}function save(i){posts[i].sv=!posts[i].sv;if(posts[i].sv)saved.push(posts[i]);else saved=saved.filter(p=>p.img[0]!=posts[i].img[0]);document.getElementById('svCount').innerText=saved.length;render()}function showPTab(t){document.getElementById('tabGrid').classList.remove('on');document.getElementById('tabSaved').classList.remove('on');document.getElementById('tabTagged').classList.remove('on');document.getElementById('tab'+t.charAt(0).toUpperCase()+t.slice(1)).classList.add('on');if(t=='saved'){if(saved.length==0){document.getElementById('pGrid').innerHTML='<div style=padding:30px;text-align:center;color:var(--g)>No saved • Tap 📑 to save • People stay longer 🔥</div>';return}document.getElementById('pGrid').innerHTML=saved.map(p=>`<img src=${p.img[0]}>`).join('')}else if(t=='grid'){document.getElementById('pGrid').innerHTML=posts.map(p=>`<img src=${p.img[0]}>`).join('')}else{document.getElementById('pGrid').innerHTML=posts.filter(p=>p.tags.length>0).map(p=>`<img src=${p.img[0]}>`).join('')||'<div style=padding:30px;text-align:center;color:var(--g)>Tagged photos where you appear @pietros</div>'}}function sharePost(i){let text=`Check this from Pietros v6 🇿🇦: ${posts[i].cap.slice(0,80)} ${location.href}`;if(navigator.share){navigator.share({title:'Pietros v6',text:text,url:location.href})}else{navigator.clipboard.writeText(text);alert('Link copied! Share to WhatsApp 🚀\n'+text)}}function shareP(){sharePost(0)}function swFeed(t){document.getElementById('bFor').classList.toggle('on',t=='for');document.getElementById('bFol').classList.toggle('on',t=='fol');if(t=='fol'){document.getElementById('feedC').innerHTML='<div style=padding:30px;text-align:center;color:var(--g)>Following 412<br>Only people you follow<br><br><button onclick=showFollowers("following") style=padding:8px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--t)>See List</button></div>';}else render()}function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));if(id=='feedP')document.getElementById('tFeed').classList.add('on');if(id=='searchP')document.getElementById('tSearch').classList.add('on');if(id=='profileP')document.getElementById('tProf').classList.add('on');if(id=='notifP')renderN();if(id=='feedP')render();window.scrollTo(0,0)}function renderN(){document.getElementById('nList').innerHTML=notifs.map(n=>`<div style="padding:10px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--bd)"><img src=${n.img} style="width:40px;height:40px;border-radius:50%"><div><div>${n.t} <small style=background:var(--bd);padding:1px 6px;border-radius:8px;font-size:9px>${n.type}</small></div><small style=color:var(--g)>${n.tm}</small></div><button onclick="this.parentElement.style.display='none'" style=margin-left:auto;background:none;border:none;color:var(--g)>✕</button></div>`).join('')}function doSearch(v){if(!v){document.getElementById('sGrid').innerHTML=posts.map(p=>`<img src=${p.img[0]}>`).join('');return}document.getElementById('sGrid').innerHTML=`<div style=padding:12px>Search "${v}" • ${posts.length} results 🇿🇦<br><small>Try #Mbombela @mbombela</small></div>`+posts.map(p=>`<img src=${p.img[0]}>`).join('')}function setFilter(f,el){curFilter=f;document.querySelectorAll('.filterBtn').forEach(b=>b.classList.remove('on'));el.classList.add('on');}function previewM(){let files=document.getElementById('fIn').files;let cont=document.getElementById('multiPreview');cont.innerHTML='';multiImgs=[];for(let i=0;i<files.length;i++){let url=URL.createObjectURL(files[i]);multiImgs.push(url);cont.innerHTML+=`<img src=${url} style=width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid var(--b)>`}if(multiImgs.length>0)cont.innerHTML+=`<small style=color:var(--g);align-self:center>${multiImgs.length} pics • Carousel ✅</small>`}function openU(){document.getElementById('mTitle').innerText='Create Post • ALL 20 ✅';document.getElementById('uModal').classList.add('on')}f ?${Date.now()}`,title:t,price:p,seller:'you'});renderMarket();alert(`Listed! 🛒 ${t} for ${p} • Buyers will DM you • Marketplace ✅`)}}function buyItem(title){alert(`Buy ${title} 🛒\n\nContact seller on WhatsApp:\n+27 71 xxx xxxx\nMbombela local pickup\n\nMarketplace feature ✅`);window.open(`https://wa.me/?text=Hi I want ${title} from Pietros app`,'_blank')}function showAds(){alert('📢 ADS MANAGER\n\nBoost post: R50 = 1,000 reach\nBusinesses pay to promote\n\nYour rate: R150 per 1k reach\n8,662 followers = R1,200 per post\n\nAds Manager ✅ • Monetize!') }function showPostMenu(i){let act=prompt(`Post options:\n1=Report\n2=Block user\n3=Copy link\n4=Share to WhatsApp\n5=Toggle Ad badge\n\nType 1-5:`);if(act=='1')reportUser('post');else if(act=='2')alert('User blocked 🚫 • Report/Block feature ✅');else if(act=='3'){navigator.clipboard.writeText(location.href);alert('Link copied!')}else if(act=='4')sharePost(i);else if(act=='5'){posts[i].isAd=!posts[i].isAd;render();alert(posts[i].isAd?'Marked as AD • Sponsored badge ✅':'Removed ad badge')}}function reportUser(u){let r=prompt(`Report @${u}?\n1=Spam\n2=Fake\n3=Harassment\n\nReport/Block feature:`);if(r)alert(`Reported @${u} 🚩 • Thanks • We review in 24h\nReport/Block ✅`)}function showLegal(type){let titles={about:'About Pietros v6',privacy:'Privacy Policy',terms:'Terms of Service',ads:'Ads Manager'};let bodies={about:'PIETROS v6 ULTIMATE 🇿🇦<br><br>Built in Mbombela by Skhosana<br>REAL LIKES ONLY • 1 Account = 1 Like<br>Anti-Bot 🛡️ • No fake likes<br>MADE IN SA 🇿🇦<br><br>All 20 features of FB/IG/TikTok + your superpower: REAL likes.<br>Brands pay YOU because you guarantee real engagement.<br><br>HIRE ME + SUPPORT buttons keep your edge.',privacy:'Privacy • Pietros v6<br><br>We collect: Likes (1 per account), Comments, Posts<br>We DON’T sell data<br>Real likes only • Anti-bot v2<br>Your data stays in SA<br>Contact: pietros@skhosana.vercel.app',terms:'Terms • Pietros v6<br><br>1. 1 Account = 1 Like (real likes only)<br>2. No bots • Anti-bot will block<br>3. Be respectful • No spam<br>4. Mbombela first • Support local<br>5. R2 per post reward is real<br>6. Marketplace: Seller responsible<br>By using app you agree.',ads:'Ads Manager • Monetize<br><br>Boost post: R50 = 1k reach<br>Your followers: 8,662 = R1,200 value<br>Business dashboard:<br>• Create ad<br>• Target Mbombela / SA<br>• Pay with PayStack<br>• See analytics<br>Brands love REAL likes!<br>Contact for ad: WhatsApp us'};document.getElementById('legalTitle').innerText=titles[type];document.getElementById('legalBody').innerHTML=bodies[type];document.getElementById('legalModal').classList.add('on')}function toggleTheme(){let isL=document.documentElement.getAttribute('data-theme')=='light';document.documentElement.setAttribute('data-theme',isL?'':'light');document.getElementById('thBtn').innerText=isL?'🌙':'☀️';localStorage.setItem('th',isL?'dark':'light')}if(localStorage.getItem('th')=='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('thBtn').innerText='☀️'}render();
