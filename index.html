<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PIETROS v4 INSTA 🇿🇦</title>
<style>
:root{--bg:#000;--card:#111;--bd:#222;--t:#fff;--g:#8e8e8e;--b:#0095f6}
[data-theme=light]{--bg:#fff;--card:#fff;--bd:#dbdbdb;--t:#000}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,system-ui}
body{background:var(--bg);color:var(--t);padding-bottom:60px}
.hd{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;justify-content:space-between;padding:12px 16px}
.logo{font-weight:900;font-size:18px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 8px;border-bottom:1px solid var(--bd)}
.story{text-align:center;min-width:66px;cursor:pointer}
.ring{width:66px;height:66px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ring.viewed{background:var(--bd)}
.story img{width:60px;height:60px;border-radius:50%;border:3px solid var(--bg);object-fit:cover}
.story span{font-size:11px;display:block;margin-top:4px}
.ftog{display:flex;border-bottom:1px solid var(--bd)}
.ftog button{flex:1;padding:14px;background:none;border:none;color:var(--g);font-weight:600;border-bottom:2px solid transparent;cursor:pointer}
.ftog button.on{color:var(--t);border-color:var(--t)}
.post{border-bottom:1px solid var(--bd);padding-bottom:8px}
.ph{padding:12px;display:flex;justify-content:space-between;align-items:center}
.phl{display:flex;gap:10px;align-items:center}
.phl img{width:32px;height:32px;border-radius:50%}
.pi{width:100%;aspect-ratio:1;object-fit:cover;background:#222}
.pa{padding:12px;display:flex;justify-content:space-between}
.pal{display:flex;gap:14px;font-size:22px}
.pal span,.par span{cursor:pointer}
.lk{padding:0 12px;font-weight:700;font-size:14px}
.cp{padding:4px 12px;font-size:14px}
.cm{padding:4px 12px;color:var(--g);font-size:13px;cursor:pointer}
.cl{padding:0 12px;font-size:13px;display:none}
.ac{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--bd);margin-top:8px}
.ac input{flex:1;background:none;border:none;color:var(--t);outline:none}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.grid img{width:100%;aspect-ratio:1;object-fit:cover}
.prof{padding:16px}
.ptop{display:flex;gap:24px;align-items:center}
.ppic{width:86px;height:86px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5)}
.ppic img{width:80px;height:80px;border-radius:50%;border:3px solid var(--bg)}
.stats{display:flex;gap:18px;text-align:center}
.stat b{display:block;font-size:18px}
.bio{margin-top:12px;font-size:14px;line-height:18px}
.bio a{color:var(--b);text-decoration:none;font-weight:600}
.pbtns{display:flex;gap:8px;margin-top:12px}
.pbtns button{flex:1;padding:7px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--t);font-weight:600;cursor:pointer}
.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--bd);display:flex;justify-content:space-around;padding:8px 0;z-index:100}
.tabs button{background:none;border:none;font-size:24px;color:var(--t);cursor:pointer;padding:4px 12px}
.page{display:none;padding:12px}.page.on{display:block}
.sb{width:100%;padding:10px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--t);margin-bottom:12px}
.notif{padding:12px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--bd)}
.notif img{width:44px;height:44px;border-radius:50%}
.fab{position:fixed;bottom:70px;right:16px;width:56px;height:56px;border-radius:50%;background:linear-gradient(45deg,#feda75,#d62976);border:none;font-size:28px;color:#fff;z-index:90}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal.on{display:flex}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;width:100%;max-width:400px;padding:20px}
.card input,.card textarea{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:1px solid var(--bd);background:var(--bg);color:var(--t)}
</style></head><body>
<div class="hd"><div class="logo">PIETROS v4 🇿🇦</div><div style="display:flex;gap:16px;font-size:22px"><span onclick="toggleTheme()" id="thBtn">🌙</span><span onclick="showP('notifP')">❤️</span><span onclick="showP('searchP')">🔍</span></div></div>
<div class="stories" id="sBar"><div class="story" onclick="openU()"><div class="ring" style="background:var(--bd)"><img src="https://picsum.photos/100?1"></div><span>Your Story +</span></div><div class="story" onclick="viewS()"><div class="ring"><img src="https://picsum.photos/100?2"></div><span>pietros</span></div><div class="story"><div class="ring"><img src="https://picsum.photos/100?3"></div><span>mbombela</span></div><div class="story"><div class="ring viewed"><img src="https://picsum.photos/100?4"></div><span>client1</span></div><div class="story"><div class="ring"><img src="https://picsum.photos/100?5"></div><span>dev_sa</span></div></div>
<div class="ftog"><button id="bFor" class="on" onclick="swFeed('for')">FOR YOU • 8,662</button><button id="bFol" onclick="swFeed('fol')">FOLLOWING</button></div>
<div id="feedP" class="page on"><div id="feedC"></div></div>
<div id="searchP" class="page"><input class="sb" placeholder="Search Mbombela, tags, people..." oninput="doSearch(this.value)"><div class="grid" id="sGrid"></div></div>
<div id="profileP" class="page"><div class="prof"><div class="ptop"><div class="ppic" onclick="viewS()"><img src="https://picsum.photos/200?1"></div><div class="stats"><div class="stat"><b id="pCount">3</b><span>Posts</span></div><div class="stat"><b>8,662</b><span>Followers</span></div><div class="stat"><b>412</b><span>Following</span></div></div></div><div class="bio"><b>PIETROS SKHOSANA 🇿🇦</b><br>Mbombela Creator | Anti-Bot v2 🛡️<br>REAL likes, not fake! 🚀<br><a href="https://skhosana.vercel.app">🔗 skhosana.vercel.app</a><br>📍 Mbombela, SA<br><br>Bio + Link in bio ✅</div><div class="pbtns"><button onclick="openU()">Share Profile</button><button onclick="openBio()">Edit Bio & Link</button></div></div><div class="ftog"><button class="on">GRID</button><button onclick="showSaved()">SAVED <span id="svCount">0</span></button></div><div class="grid" id="pGrid"></div></div>
<div id="notifP" class="page"><h3>Notifications</h3><div id="nList"></div></div>
<div class="tabs"><button onclick="showP('feedP')">🏠</button><button onclick="showP('searchP')">🔍</button><button onclick="openU()">➕</button><button onclick="showP('notifP')">❤️</button><button onclick="showP('profileP')">👤</button></div>
<button class="fab" onclick="openU()">+</button>
<div id="uModal" class="modal" onclick="if(event.target==this)closeU()"><div class="card"><h3>Upload / Edit</h3><input type="file" id="fIn" accept="image/*,video/*"><input id="capIn" placeholder="Caption..."><textarea id="bioIn" placeholder="Edit bio..." style="display:none"></textarea><input id="linkIn" placeholder="Link in bio https://..." style="display:none"><button onclick="doUp()" style="width:100%;padding:12px;background:var(--b);color:#fff;border:none;border-radius:8px;font-weight:700;margin-top:8px">POST +10 LIKES + R2</button><button onclick="closeU()" style="width:100%;padding:8px;background:none;border:none;color:var(--g);margin-top:4px">Cancel</button></div></div>
<script>
let posts=[{img:'https://picsum.photos/600?1',likes:4298,cap:'PIETROS v4 LIVE! 8,662 real likes 🇿🇦 #mbombela',cms:['🔥🔥🔥','REAL!'],sv:false},{img:'https://picsum.photos/600?2',likes:892,cap:'Building Mbombela to world 🚀',cms:['Inspired!'],sv:false},{img:'https://picsum.photos/600?3',likes:1247,cap:'Anti-bot ON 🛡️',cms:[],sv:false}];
let saved=[];let notifs=[{img:'https://picsum.photos/100?10',t:'<b>dev_sa</b> liked your post',tm:'2m'},{img:'https://picsum.photos/100?11',t:'<b>mbombela</b> followed you',tm:'10m'},{img:'https://picsum.photos/100?12',t:'<b>client1</b> commented: 🔥',tm:'1h'}];
function render(){let c=document.getElementById('feedC');c.innerHTML='';posts.forEach((p,i)=>{let d=document.createElement('div');d.className='post';d.innerHTML=`<div class=ph><div class=phl><img src=https://picsum.photos/50?${i}><b>pietros_skhosana</b> • Mbombela</div><span>⋯</span></div><img class=pi src=${p.img} ondblclick=like(${i})><div class=pa><div class=pal><span onclick=like(${i}) id=h${i}>${p.liked?'❤️':'🤍'}</span><span onclick=toggleC(${i})>💬</span><span onclick=share()>↗️</span></div><span onclick=save(${i}) id=s${i}>${p.sv?'🔖':'📑'}</span></div><div class=lk>${p.likes.toLocaleString()} REAL LIKES</div><div class=cp><b>pietros</b> ${p.cap}</div><div class=cm onclick=toggleC(${i})>View ${p.cms.length} comments</div><div class=cl id=cL${i}>${p.cms.map(x=>`<div><b>user:</b> ${x}</div>`).join('')}</div><div class=ac><input id=cI${i} placeholder=Add comment...><span style=color:var(--b);font-weight:700;cursor:pointer onclick=addC(${i})>Post</span></div>`;c.appendChild(d)});document.getElementById('pGrid').innerHTML=posts.map(p=>`<img src=${p.img}>`).join('');document.getElementById('sGrid').innerHTML=posts.map(p=>`<img src=${p.img}>`).join('');document.getElementById('pCount').innerText=posts.length}
function like(i){posts[i].liked=!posts[i].liked;posts[i].likes+=posts[i].liked?1:-1;render()}
function toggleC(i){let e=document.getElementById('cL'+i);e.style.display=e.style.display=='block'?'none':'block'}
function addC(i){let inp=document.getElementById('cI'+i);if(!inp.value)return;posts[i].cms.push(inp.value);notifs.unshift({img:posts[i].img,t:`<b>You</b> commented: ${inp.value}`,tm:'now'});inp.value='';render();renderN()}
function save(i){posts[i].sv=!posts[i].sv;if(posts[i].sv)saved.push(posts[i]);else saved=saved.filter(p=>p.img!=posts[i].img);document.getElementById('svCount').innerText=saved.length;render()}
function showSaved(){if(saved.length==0){alert('No saved yet! Tap 📑 to save');return}document.getElementById('pGrid').innerHTML=saved.map(p=>`<img src=${p.img}>`).join('')}
function share(){navigator.clipboard.writeText(location.href);alert('Link copied! Share to WhatsApp 🚀')}
function swFeed(t){document.getElementById('bFor').classList.toggle('on',t=='for');document.getElementById('bFol').classList.toggle('on',t=='fol');if(t=='fol'){document.getElementById('feedC').innerHTML='<div style=padding:40px;text-align:center;color:var(--g)>Following 412<br>Showing followed posts</div>';setTimeout(render,600)}else render()}
function showP(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));document.getElementById(id).classList.add('on');if(id=='notifP')renderN()}
function renderN(){document.getElementById('nList').innerHTML=notifs.map(n=>`<div class=notif><img src=${n.img}><div><div>${n.t}</div><small style=color:var(--g)>${n.tm}</small></div></div>`).join('')}
function doSearch(v){if(!v){document.getElementById('sGrid').innerHTML=posts.map(p=>`<img src=${p.img}>`).join('');return}document.getElementById('sGrid').innerHTML=`<div style=padding:16px>Search "${v}" • ${posts.length} results 🇿🇦</div>`+posts.map(p=>`<img src=${p.img}>`).join('')}
function openU(){document.getElementById('uModal').classList.add('on')}
function closeU(){document.getElementById('uModal').classList.remove('on');document.getElementById('bioIn').style.display='none';document.getElementById('linkIn').style.display='none'}
function openBio(){openU();document.getElementById('bioIn').style.display='block';document.getElementById('linkIn').style.display='block'}
function doUp(){let f=document.getElementById('fIn').files[0];let cap=document.getElementById('capIn').value||'New from Mbombela 🇿🇦';let bio=document.getElementById('bioIn').value;let link=document.getElementById('linkIn').value;if(bio){document.querySelector('.bio').innerHTML=bio.replace(/\n/g,'<br>')+(link?`<br><a href=${link}>🔗 ${link}</a>`:'')}if(f||cap){let url=f?URL.createObjectURL(f):`https://picsum.photos/600?${Date.now()}`;posts.unshift({img:url,likes:0,cap:cap,cms:[],sv:false});notifs.unshift({img:url,t:'<b>You</b> posted',tm:'now'})}closeU();render();showP('feedP');alert('Posted! +10 likes + R2 🚀')}
function viewS(){alert('Story: Full screen 15s • Views: 892 • Auto deletes 24h')}
function toggleTheme(){let isL=document.documentElement.getAttribute('data-theme')=='light';document.documentElement.setAttribute('data-theme',isL?'':'light');document.getElementById('thBtn').innerText=isL?'🌙':'☀️';localStorage.setItem('th',isL?'dark':'light')}
if(localStorage.getItem('th')=='light'){document.documentElement.setAttribute('data-theme','light');document.getElementById('thBtn').innerText='☀️'}render();renderN();
</script></body></html>
